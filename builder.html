<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lyra Builder · by Muhammad Taqi</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070c;--ink:#e9e9f2;--muted:#8b8ba7;--line:rgba(255,255,255,.08);--card:rgba(255,255,255,.03);--violet:#a78bfa;--cyan:#22d3ee;--pink:#f472b6;--green:#34d399}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;padding:40px 20px;margin:0}
.wrap{max-width:800px;margin:0 auto}
.card{border:1px solid var(--line);border-radius:20px;background:var(--card);padding:30px;margin-bottom:20px}
h1{font-family:'Space Grotesk';font-size:32px;margin:0 0 10px;text-align:center}
p{color:var(--muted);font-size:14px;margin-bottom:20px;text-align:center}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
input,textarea,select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);font-family:inherit;font-size:14px;margin-bottom:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--violet)}
textarea{min-height:150px;font-family:monospace}
.btn{background:linear-gradient(120deg,var(--violet),var(--cyan));color:#07070c;border:0;padding:16px 24px;border-radius:12px;font-weight:600;cursor:pointer;width:100%;font-size:16px;transition:.2s}
.btn:hover{filter:brightness(1.1)} .btn:disabled{opacity:.5;cursor:not-allowed}
.result{display:none;margin-top:20px;padding:24px;border-radius:16px;border:1px solid var(--green);background:rgba(52,211,153,.05);text-align:center}
.result.show{display:block}
.qr-box{margin:20px auto;padding:12px;background:#fff;border-radius:16px;display:inline-block;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.qr-box img{display:block;width:220px;height:220px}
.linkrow{display:flex;gap:8px;justify-content:center;align-items:center;margin:8px 0;flex-wrap:wrap;font-size:13px}
.linkrow code{background:rgba(0,0,0,.5);padding:8px 12px;border-radius:8px;font-size:12px;word-break:break-all;color:var(--cyan)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Publish your <span style="color:var(--cyan)">own web</span></h1>
  <p>Choose a category, paste your HTML code, and publish. We'll generate a QR code for it.</p>

  <div class="card">
    <label>Category</label>
    <select id="cat">
      <option value="ai">🧠 AI</option>
      <option value="web">🌐 Web</option>
      <option value="game">🎮 Game</option>
      <option value="other">✨ Other</option>
    </select>

    <label>Site Name (e.g. taqi)</label>
    <input type="text" id="name" placeholder="taqi" autocomplete="off">

    <label>HTML Code</label>
    <textarea id="html" placeholder="<!doctype html>&#10;<html>..."></textarea>

    <button class="btn" id="publishBtn">Publish & Generate QR</button>
  </div>

  <div class="result" id="result">
    <h3 style="margin-top:0">🎉 Your site is live!</h3>
    <div class="qr-box">
      <img id="qrImg" src="" alt="QR Code">
    </div>
    <div class="linkrow"><span>Live URL:</span> <code id="liveUrl"></code></div>
    <div class="linkrow"><span>QR Link:</span> <code id="qrUrl"></code></div>
    <p style="font-size:12px;color:var(--muted);margin-top:16px">Scan this QR code with your phone to view your site.</p>
  </div>
</div>

<script>
// Default free TLD
const TLD = 'lyra.stu'; 

document.getElementById('publishBtn').onclick = async () => {
  const cat = document.getElementById('cat').value;
  const name = document.getElementById('name').value.trim();
  const html = document.getElementById('html').value;
  const btn = document.getElementById('publishBtn');

  if (!name || html.length < 50) return alert('Please enter a valid name and HTML code (min 50 chars).');

  btn.disabled = true; btn.textContent = 'Publishing...';

  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ category: cat, name: name, html: html, tld: TLD })
    });
    const data = await res.json();

    if (data.ok) {
      document.getElementById('qrImg').src = data.qr;
      document.getElementById('liveUrl').textContent = data.live;
      document.getElementById('qrUrl').textContent = data.qr;
      document.getElementById('result').classList.add('show');
      document.getElementById('result').scrollIntoView({behavior:'smooth'});
    } else {
      alert('Error: ' + data.error);
    }
  } catch (e) {
    alert('Network error: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Publish & Generate QR';
  }
};
</script>
</body>
</html>
