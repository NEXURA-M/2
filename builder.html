<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyra Builder — Create Your Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.08); }
    .glow { box-shadow: 0 0 40px rgba(139,92,246,0.15); }
    .gradient-text { background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .input-field { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s; }
    .input-field:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.2); outline: none; }
    .btn-primary { background: linear-gradient(135deg, #8b5cf6, #6366f1); transition: all 0.3s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(139,92,246,0.4); }
    .domain-card { transition: all 0.2s; cursor: pointer; }
    .domain-card:hover { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.4); }
    .domain-card.selected { background: rgba(139,92,246,0.15); border-color: #8b5cf6; }
    .badge-free { background: rgba(52,211,153,0.15); color: #34d399; }
    .badge-paid { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .badge-pro { background: rgba(239,68,68,0.15); color: #ef4444; }
  </style>
</head>
<body class="antialiased">
  <!-- Animated background blobs -->
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] rounded-full bg-violet-600/10 blur-[120px]"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[500px] h-[500px] rounded-full bg-blue-600/10 blur-[120px]"></div>
  </div>

  <div class="max-w-5xl mx-auto px-6 py-16">
    <!-- Header -->
    <header class="text-center mb-12">
      <h1 class="text-6xl font-extrabold gradient-text mb-4">Create Your Web</h1>
      <p class="text-gray-400 text-lg">Build and host your HTML pages instantly — no login, no limits.</p>
      <p class="text-gray-600 text-sm mt-2">by Muhammad Taqi</p>
    </header>

    <!-- Form -->
    <form id="builderForm" class="glass rounded-3xl p-8 glow">
      <!-- Name -->
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-300 mb-2">Project Name</label>
        <input type="text" id="name" required placeholder="e.g., My Portfolio"
               class="input-field w-full rounded-xl px-5 py-3 text-white placeholder-gray-500" />
      </div>

      <!-- HTML Code -->
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-300 mb-2">HTML Code</label>
        <textarea id="htmlCode" required rows="10" placeholder="<h1>Hello World</h1>"
                  class="input-field w-full rounded-xl px-5 py-3 text-white placeholder-gray-500 font-mono text-sm"></textarea>
      </div>

      <!-- Domain Selection -->
      <div class="mb-8">
        <label class="block text-sm font-semibold text-gray-300 mb-3">Choose Your Domain</label>
        <div id="domainGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3 max-h-96 overflow-y-auto pr-2"></div>
      </div>

      <!-- Submit -->
      <button type="submit" id="submitBtn"
              class="btn-primary w-full py-4 rounded-2xl font-bold text-lg text-white">
        🚀 Launch My Web
      </button>
    </form>

    <!-- Result Message -->
    <div id="resultBox" class="hidden mt-8 glass rounded-2xl p-6 text-center"></div>
  </div>

  <script>
    // ---------- Domain data ----------
    const domains = [
      { tld: '.com', price: 2, type: 'paid' },
      { tld: '.net', price: 2, type: 'paid' },
      { tld: '.org', price: 2, type: 'paid' },
      { tld: '.mt', price: 3, type: 'paid', tier: 'pro' },
      { tld: '.zf', price: 3, type: 'paid', tier: 'pro' },
      { tld: '.stu', price: 1, type: 'paid', tier: 'student' },
      { tld: '.lyra.com', price: 1, type: 'paid' },
      { tld: '.lyra.net', price: 1, type: 'paid' },
      { tld: '.lyra.org', price: 1, type: 'paid' },
      { tld: '.lyra.mt', price: 2, type: 'paid', tier: 'pro' },
      { tld: '.lyra.zf', price: 2, type: 'paid', tier: 'pro' },
      { tld: '.lyra.stu', price: 0, type: 'free' },
      { tld: '.taqi.lyra', price: 0, type: 'free' },
      { tld: '.taqi.tk', price: 0, type: 'free' },
      { tld: '.taqi.tl', price: 0, type: 'free' },
      { tld: '.lyra.tk', price: 0, type: 'free' },
      { tld: '.app', price: 100, type: 'paid', tier: 'ultra' },
      { tld: '.site', price: 100, type: 'paid', tier: 'ultra' },
      { tld: '.mt', price: 150, type: 'paid', tier: 'ultra' }, // duplicate .mt with higher price
      { tld: '.zf', price: 200, type: 'paid', tier: 'ultra' },
      { tld: '.lyra.app', price: 50, type: 'paid', tier: 'ultra' },
      { tld: '.lyra.site', price: 50, type: 'paid', tier: 'ultra' },
      { tld: '.oneapp.dev', price: 10, type: 'paid' },
      { tld: '.duckdns.org', price: 10, type: 'paid' },
      { tld: '.ai.studio', price: 20, type: 'paid' },
      { tld: 'Custom TLD', price: 1000, type: 'paid', tier: 'custom' }
    ];

    let selectedDomain = null;

    // Render domain cards
    const grid = document.getElementById('domainGrid');
    domains.forEach((d, i) => {
      const card = document.createElement('div');
      card.className = 'domain-card glass rounded-xl p-4 text-center';
      const priceLabel = d.price === 0 ? 'FREE' : `$${d.price}`;
      const badgeClass = d.price === 0 ? 'badge-free' : (d.tier === 'pro' || d.tier === 'ultra' ? 'badge-pro' : 'badge-paid');
      const tierLabel = d.tier ? `<span class="text-xs ${badgeClass} px-2 py-0.5 rounded-full ml-1">${d.tier}</span>` : '';
      card.innerHTML = `
        <div class="text-xl font-bold text-white">${d.tld}</div>
        <div class="text-sm text-gray-400 mt-1">${priceLabel} ${tierLabel}</div>
      `;
      card.addEventListener('click', () => {
        document.querySelectorAll('.domain-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedDomain = d;
      });
      grid.appendChild(card);
    });

    // ---------- Form submission ----------
    document.getElementById('builderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const html = document.getElementById('htmlCode').value.trim();
      if (!name || !html) return alert('Please fill all fields.');
      if (!selectedDomain) return alert('Please choose a domain.');

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Processing...';

      try {
        const res = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, html, domain: selectedDomain.tld, price: selectedDomain.price })
        });
        const data = await res.json();

        const box = document.getElementById('resultBox');
        box.classList.remove('hidden');

        if (data.status === 'paid') {
          box.innerHTML = `
            <p class="text-amber-400 text-lg font-semibold">💳 Paid Domain Selected</p>
            <p class="text-gray-300 mt-2">${data.message}</p>
            <a href="${data.contact}" target="_blank" class="inline-block mt-4 px-6 py-2 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-semibold">Contact to Purchase</a>
          `;
        } else if (data.status === 'success') {
          box.innerHTML = `
            <p class="text-emerald-400 text-lg font-semibold">✅ Your web is live!</p>
            <p class="text-gray-300 mt-2">Name: <strong>${name}</strong></p>
            <p class="text-gray-300">Domain: <strong>${selectedDomain.tld}</strong></p>
            <p class="text-gray-400 text-sm mt-2">You can view it in the Lyra Browser.</p>
            <a href="${data.url}" target="_blank" class="inline-block mt-4 px-6 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold">Open Your Web ↗</a>
          `;
          document.getElementById('builderForm').reset();
          document.querySelectorAll('.domain-card').forEach(c => c.classList.remove('selected'));
          selectedDomain = null;
        } else {
          box.innerHTML = `<p class="text-red-400">❌ ${data.message || 'Something went wrong.'}</p>`;
        }
      } catch (err) {
        alert('Network error. Please try again.');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 Launch My Web';
      }
    });
  </script>
</body>
</html>
