name: Lyra Builder Tunnel

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

concurrency:
  group: lyra-tunnel
  cancel-in-progress: true

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Files
        run: |
          if [ ! -f data.json ]; then echo "[]" > data.json; fi
          git config --local user.name  "lyra-bot"
          git config --local user.email "lyra-bot@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors requests

      - name: Start Flask server
        run: |
          nohup python server.py > server.log 2>&1 &
          sleep 4

      - name: Start TryCloudflare & Save URL
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:5000 --no-autoupdate > tunnel.log 2>&1 &
          
          URL=""
          for i in $(seq 1 40); do
            URL=$(grep -o 'https://[^ ]*trycloudflare.com' tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 1
          done

          if [ -z "$URL" ]; then
            echo "❌ Tunnel URL not found."; cat tunnel.log; exit 1
          fi

          echo "$URL" > url.txt
          echo "🔗 Live URL: $URL"
          
          git add url.txt
          git commit -m "chore: update url.txt [skip ci]" || echo "No changes"
          git push origin ${GITHUB_REF_NAME} || echo "Push failed"

      - name: Auto-Sync to DB Branch
        run: |
          cat << 'EOF' > sync.sh
          #!/bin/bash
          while true; do
            if [ -f data.json ]; then
              cp data.json /tmp/latest_data.json
              git fetch origin db 2>/dev/null || true
              
              if git show-ref --verify --quiet refs/remotes/origin/db; then
                git checkout -B db origin/db
              else
                git checkout --orphan db
                git rm -rf . > /dev/null 2>&1
              fi
              
              cp /tmp/latest_data.json data.json
              git add data.json
              git commit -m "auto: update db [skip ci]" || echo "No changes"
              git push origin db --force
              
              git checkout ${GITHUB_REF_NAME} -f
            fi
            sleep 60  # ✨ Ab har 1 minute baad sync hoga (pehle 300 tha) ✨
          done
          EOF
          chmod +x sync.sh
          nohup ./sync.sh > sync.log 2>&1 &

      - name: Keep Alive
        run: sleep 13500
