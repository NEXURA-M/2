name: Lyra Builder · TryCloudflare tunnel (auto-refresh every 2h)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'builder.html'
      - 'scripts/server.py'

permissions:
  contents: write

concurrency:
  group: lyra-builder
  cancel-in-progress: true

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install flask requests

      - name: Fetch cloudflared
        run: |
          curl -sSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Heartbeat + tunnel + save url.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          printf 'last-run: %s\nrun-id: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "${{ github.run_id }}" > dummy.txt
          python scripts/server.py > server.log 2>&1 &
          sleep 3
          ./cloudflared tunnel --url http://127.0.0.1:5000 --no-autoupdate > tunnel.log 2>&1 &

          URL=""
          for i in $(seq 1 40); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then echo "❌ Tunnel failed:"; cat tunnel.log; exit 1; fi

          printf 'url: %s\nupdated: %s\nrun: %s\n' "$URL" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "${{ github.run_id }}" > url.txt

          git config user.name "lyra-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dummy.txt url.txt
          git commit -m "chore: refresh builder URL [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push || true

          echo "## 🚀 Lyra Builder is live" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY

          sleep 10800
