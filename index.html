<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyra Browser — Explore Created Webs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.08); }
    .glow { box-shadow: 0 0 40px rgba(139,92,246,0.15); }
    .gradient-text { background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .site-card { transition: all 0.3s; cursor: pointer; }
    .site-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(139,92,246,0.2); border-color: rgba(139,92,246,0.4); }
    iframe { width: 100%; height: 100%; border: none; border-radius: 1rem; }
  </style>
</head>
<body class="antialiased">
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] rounded-full bg-violet-600/10 blur-[120px]"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[500px] h-[500px] rounded-full bg-blue-600/10 blur-[120px]"></div>
  </div>

  <div class="max-w-6xl mx-auto px-6 py-16">
    <header class="text-center mb-12">
      <h1 class="text-6xl font-extrabold gradient-text mb-4">Lyra Browser</h1>
      <p class="text-gray-400 text-lg">Explore every web created with Lyra Builder.</p>
    </header>

    <div id="sitesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <div id="emptyState" class="hidden text-center py-20">
      <p class="text-gray-500 text-xl">No sites yet. Be the first to <a id="createLink" href="#" class="text-violet-400 underline" target="_blank">create one</a>!</p>
    </div>
  </div>

  <div id="viewer" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm p-6">
    <div class="relative w-full h-full max-w-5xl mx-auto">
      <button onclick="closeViewer()" class="absolute -top-12 right-0 text-white text-3xl hover:text-violet-400">&times;</button>
      <iframe id="viewerFrame" class="glass rounded-2xl" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </div>

  <script>
    // ⚠️ YAHAN APNA GITHUB USERNAME AUR REPO NAME DALEIN ⚠️
    const GITHUB_USERNAME = 'NEXURA-2'; // Apna username dalein
    const GITHUB_REPO = 'lyra-builder'; // Apna repo name dalein
    
    // Data 'db' branch se fetch hoga
    const DATA_URL = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/db/data.json`;
    const URL_TXT_LINK = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/url.txt`;

    async function loadSites() {
      try {
        // Cache bypass karne ke liye timestamp laga rahe hain
        const res = await fetch(`${DATA_URL}?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error('Failed to fetch data');
        const data = await res.json();
        renderSites(data);
      } catch (err) {
        console.error(err);
        document.getElementById('emptyState').classList.remove('hidden');
      }
    }

    function renderSites(sites) {
      const grid = document.getElementById('sitesGrid');
      grid.innerHTML = '';
      if (!sites || sites.length === 0) {
        document.getElementById('emptyState').classList.remove('hidden');
        return;
      }
      document.getElementById('emptyState').classList.add('hidden');
      sites.forEach(site => {
        const card = document.createElement('div');
        card.className = 'site-card glass rounded-2xl p-6';
        card.innerHTML = `
          <h3 class="text-2xl font-bold text-white">${site.name}</h3>
          <p class="text-violet-400 text-sm mt-1">${site.domain}</p>
          <p class="text-gray-500 text-xs mt-3">Click to open</p>
        `;
        card.addEventListener('click', () => {
          window.location.hash = site.domain;
        });
        grid.appendChild(card);
      });
    }

    async function handleHash() {
      const domain = window.location.hash.replace('#', '');
      if (!domain) {
        closeViewer();
        return;
      }
      try {
        const res = await fetch(`${DATA_URL}?t=${new Date().getTime()}`);
        const sites = await res.json();
        const site = sites.find(s => s.domain === domain);
        if (site && site.url) {
          openViewer(site.url);
        } else {
          alert('Site not found.');
          window.location.hash = '';
        }
      } catch (err) {
        alert('Error loading site.');
      }
    }

    function openViewer(url) {
      document.getElementById('viewerFrame').src = url;
      document.getElementById('viewer').classList.remove('hidden');
    }

    function closeViewer() {
      document.getElementById('viewer').classList.add('hidden');
      document.getElementById('viewerFrame').src = 'about:blank';
      window.location.hash = '';
    }

    // Builder URL auto-fetch karna
    fetch(URL_TXT_LINK).then(r => r.text()).then(url => {
      document.getElementById('createLink').href = url.trim();
    }).catch(() => {});

    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', () => {
      loadSites();
      if (window.location.hash) handleHash();
    });
  </script>
</body>
</html>
